name: Keep Streamlit App Alive

on:
  schedule:
    # 00:00 UTC on days 1, 4, 7, ..., 31; the pattern restarts each month.
    # GitHub may disable inactive schedules; see docs/keep-alive.md to re-enable.
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Streamlit App
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            --output /dev/null --write-out 'HTTP %{http_code}\n' \
            https://egx-radar-2semzy6ki8y3xttrqxes7t.streamlit.app/
